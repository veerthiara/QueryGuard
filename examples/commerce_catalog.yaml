catalog_name: commerce
catalog_version: "1.0"
dialect: postgresql
global_rules:
  - Only SELECT statements are permitted.
  - User-scoped tables must be filtered by the application user parameter.
tables:
  - name: customers
    description: Customer accounts
    aliases: [customer_accounts]
    user_scoped: false
    columns:
      - name: id
        description: Customer identifier
        data_type: uuid
        is_primary_key: true
        nullable: false
      - name: account_id
        description: Owning account identifier
        data_type: uuid
        nullable: false
      - name: name
        description: Customer display name
        data_type: varchar(255)
        nullable: false
  - name: orders
    description: Customer orders
    aliases: [sales_orders]
    user_scoped: true
    business_rules:
      - Order totals are stored in cents.
    columns:
      - name: id
        description: Order identifier
        data_type: uuid
        is_primary_key: true
        nullable: false
      - name: account_id
        description: Owning account identifier
        data_type: uuid
        is_user_scope: true
        nullable: false
      - name: customer_id
        description: Customer reference
        data_type: uuid
        is_foreign_key: true
        foreign_key_target: customers.id
        nullable: false
      - name: total_cents
        description: Order total in cents
        data_type: integer
        nullable: false
  - name: order_items
    description: Order line items
    user_scoped: true
    columns:
      - name: id
        description: Line item identifier
        data_type: uuid
        is_primary_key: true
        nullable: false
      - name: account_id
        description: Owning account identifier
        data_type: uuid
        is_user_scope: true
        nullable: false
      - name: order_id
        description: Order reference
        data_type: uuid
        is_foreign_key: true
        foreign_key_target: orders.id
        nullable: false
      - name: product_name
        description: Purchased product name
        data_type: varchar(255)
        nullable: false
relationships:
  - left_table: orders
    left_column: customer_id
    right_table: customers
    right_column: id
    relationship_type: many_to_one
    description: Orders belong to customers.
  - left_table: order_items
    left_column: order_id
    right_table: orders
    right_column: id
    relationship_type: many_to_one
    description: Line items belong to orders.
